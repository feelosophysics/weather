name: Deploy weather to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript
        run: npm run check
      - name: Refresh KMA monthly outlook
        id: outlook
        continue-on-error: true
        run: npm run refresh -- --force
      - name: Report retained outlook
        if: steps.outlook.outcome == 'failure'
        run: echo "::warning::KMA refresh failed. Deploying the saved outlook with its original issue date."
      - name: Test weather data handling
        run: npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static app
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
